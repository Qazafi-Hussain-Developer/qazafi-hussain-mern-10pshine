# ================== SONAR PROJECT SETTINGS ==================
sonar.projectKey=qazafi-hussain-mern-10pshine
sonar.organization=qazafi-hussain-developer
sonar.host.url=https://sonarcloud.io

# ================== PROJECT NAME ==================
sonar.projectName=Qazafi Hussain MERN Notes App

# ================== SOURCE & TEST SETTINGS ==================
# Main source code
sonar.sources=frontend/src,backend/src

# Exclude unnecessary folders
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/public/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Test files location
sonar.tests=frontend/src,backend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# ================== COVERAGE SETTINGS ==================
# Coverage report paths (single line, no duplicate)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

# ================== GENERAL SETTINGS ==================
sonar.sourceEncoding=UTF-8

# ================== OPTIONAL: JAVASCRIPT SPECIFIC ==================
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.javascript.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# ================== OPTIONAL: TEST COVERAGE THRESHOLDS ==================
# Uncomment if you want to enforce coverage
# sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.test.jsx,**/validators/**,**/config/**