sonar.projectKey=qazafi-mern-10pshine
sonar.projectName=Qazafi MERN Notes App
sonar.projectVersion=1.0.0

# Source directories (FIXED: backend has no src folder)
sonar.sources=backend,frontend/src

# Test directories (FIXED: backend/tests doesn't exist yet)
sonar.tests=frontend/src

# Coverage report path (FIXED: correct path for Jest coverage)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclude node_modules and build files
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js

# JavaScript/TypeScript rules
sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx

# Source encoding
sonar.sourceEncoding=UTF-8