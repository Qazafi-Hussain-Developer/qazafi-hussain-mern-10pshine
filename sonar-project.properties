sonar.projectKey=lavender-notes
sonar.projectName=Lavender Notes App
sonar.projectVersion=1.0.0

sonar.sources=frontend/src,backend/src
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.test.jsx,**/coverage/**,**/dist/**,**/build/**

sonar.tests=frontend/tests,backend/tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

sonar.javascript.file.suffixes=.js,.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8


# Create the config file
@"
sonar.projectKey=lavender-notes
sonar.projectName=Lavender Notes App
sonar.projectVersion=1.0.0
sonar.sources=frontend/src,backend/src
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.test.jsx
sonar.sourceEncoding=UTF-8
"@ | Out-File -FilePath sonar-project.properties -Encoding utf8